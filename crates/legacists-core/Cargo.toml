[package]
name = "legacists-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Independent, offline static analysis for legacists"

[dependencies]
encoding_rs = "=0.8.42"
quick-xml = "=0.42.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tree-sitter = "=0.27.1"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
